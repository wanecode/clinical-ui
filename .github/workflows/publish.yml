name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: verify, pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Resolve and verify release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          node scripts/verify-release.mjs "$version"
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Pack publishable workspaces
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/clinical-ui-$RELEASE_VERSION"
          mkdir -p "$release_dir"
          for package_name in theme core fhir testing ophthalmology ent odontology dermatology cardiology pediatrics gynecology-obstetrics; do
            pnpm --filter "@clinical-ui/$package_name" pack --pack-destination "$release_dir"
          done
          test "$(find "$release_dir" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 11
          for archive in "$release_dir"/*.tgz; do
            if tar -xOzf "$archive" 2>/dev/null | grep -E '"(workspace:|file:|link:)' ; then
              exit 1
            fi
          done
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
      - name: Smoke-test the packed packages
        run: node scripts/smoke-release.mjs "$RELEASE_DIR"
      - name: Publish to npm with provenance
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for package_name in theme core fhir testing ophthalmology ent odontology dermatology cardiology pediatrics gynecology-obstetrics; do
            package="@clinical-ui/$package_name"
            if npm view "$package@$RELEASE_VERSION" version >/dev/null 2>&1; then
              echo "$package@$RELEASE_VERSION is already published"
              continue
            fi
            archive=$(find "$RELEASE_DIR" -maxdepth 1 -name "clinical-ui-$package_name-*.tgz" -print -quit)
            test -n "$archive"
            npm publish "$archive" --access public --tag "$DIST_TAG"
          done
