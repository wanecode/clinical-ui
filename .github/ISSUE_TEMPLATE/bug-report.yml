name: Bug report
description: Report a reproducible Clinical UI defect using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real patient data, production screenshots, credentials or private endpoints.
  - type: textarea
    id: component
    attributes:
      label: Component or story
      description: Include the Storybook title and story name when possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic input data.
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options: [Desktop, Tablet, Mobile, All]
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme
      placeholder: clinical/light
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains only synthetic or public non-sensitive data.
          required: true
